apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghostops-app
  labels:
    app: ghostops-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ghostops-app
  template:
    metadata:
      labels:
        app: ghostops-app
    spec:
      containers:
      - name: core-app
        image: ghostops-fastapi-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        env:
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: ghostops-secrets
              key: GROQ_API_KEY
        - name: JAEGER_HOST
          value: "jaeger-agent"
        - name: JAEGER_PORT
          value: "6831"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ghostops-service
spec:
  type: NodePort
  selector:
    app: ghostops-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
      nodePort: 30080
